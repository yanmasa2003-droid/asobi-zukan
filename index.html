<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15142b"><title>あそび図鑑</title><style>body{margin:0;background:#15142b;color:#fff;font-family:system-ui}main{max-width:700px;margin:auto;padding:24px 16px}button,input,select{background:#373451;color:white;border:0;border-radius:12px;padding:12px;font:inherit;margin:4px}button{cursor:pointer}.active,.primary{background:#b5a1ff;color:#171329;font-weight:700}.card{background:#24223c;border-radius:16px;padding:18px;margin:12px 0}.tag{font-size:12px;color:#c8c2ff}p{color:#d1cde2}.big{font-size:26px;font-weight:800;padding:24px 0}input{width:110px}</style><main><h1>🎲 あそび図鑑</h1><p>友達と集まったら、すぐ遊ぼう。</p><nav id="nav"></nav><section id="view"></section></main><script>
const games=[['究極の二択','会話',2,'二択を選んで理由を語り合う'],['NGワード','心理戦',3,'禁止ワードを言わずに会話する'],['ワードウルフ','推理',3,'少数派のお題を持つ人を見抜く'],['お題しりとり','言葉',2,'指定ジャンルだけでしりとり'],['ジェスチャー','表現',3,'声を出さずにお題を伝える'],['多数派ゲーム','心理戦',3,'多数派になる答えを予想する'],['私は誰でしょう','推理',2,'質問を重ねて正体を当てる'],['即興プレゼン','表現',2,'無茶なお題を30秒で紹介'],['古今東西','言葉',2,'テーマに沿う言葉を順番に言う'],['偏見ランキング','会話',3,'お題に合う人を選んで話す'],['共通点探し','協力',2,'制限時間内に共通点を探す'],['嘘つき自己紹介','推理',3,'自己紹介の中の嘘を当てる']];
const choices=['一生夏だけ or 冬だけ','過去に戻る or 未来を見る','ラーメン禁止 or カレー禁止','心が読める or 透明になる','旅行はノープラン or 分刻みの計画','親友1人 or 知り合い100人','毎日同じ朝食 or 同じ夕食','10年前の自分に会う or 10年後の自分に会う'];
const topics=['コンビニで買うもの','実在する動物','学校にあるもの','映画のタイトル','旅行先','子どもの頃の遊び','赤いもの','絶対に売れない新商品','無人島に持っていくもの','有名なキャラクター','こんな上司は嫌だ'];
let tab='探す',cat='すべて',seconds=60,timer=null,players=['チームA','チームB'],scores=[0,0];try{players=JSON.parse(localStorage.azPlayers)||players;scores=JSON.parse(localStorage.azScores)||scores}catch(e){}
const el=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],save=()=>{localStorage.azPlayers=JSON.stringify(players);localStorage.azScores=JSON.stringify(scores)},fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function render(){el('nav').innerHTML=['探す','お題','タイマー','得点'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');let v='';if(tab==='探す'){v='<select onchange="cat=this.value;render()">'+['すべて','会話','心理戦','推理','言葉','表現','協力'].map(c=>'<option '+(c===cat?'selected':'')+'>'+c+'</option>').join('')+'</select><button class="primary" onclick="game(pick(games.filter(g=>cat===\'すべて\'||g[1]===cat))[0])">🎲 おまかせ</button>'+games.filter(g=>cat==='すべて'||g[1]===cat).map(g=>'<div class="card"><h3>'+g[0]+'</h3><span class="tag">'+g[1]+' · '+g[2]+'人〜</span><p>'+g[3]+'</p><button onclick="game(\''+g[0]+'\')">遊び方を見る</button></div>').join('')}else if(tab==='お題'){v='<div class="card"><h3>お題ジェネレーター</h3><select id="kind"><option>究極の二択</option><option>ランダムお題</option></select><div class="big" id="prompt">ボタンを押してスタート！</div><button class="primary" onclick="el(\'prompt\').textContent=pick(el(\'kind\').value===\'究極の二択\'?choices:topics)">次のお題 ✨</button></div>'}else if(tab==='タイマー'){v='<div class="card"><h3>ゲームタイマー</h3>'+[30,60,90,180].map(n=>'<button onclick="reset('+n+')">'+n+'秒</button>').join('')+'<div class="big" id="clock">'+fmt(seconds)+'</div><button class="primary" onclick="toggle()">'+(timer?'一時停止':'スタート')+'</button><button onclick="reset(60)">リセット</button></div>'}else{v='<div class="card"><h3>得点ボード</h3>'+players.map((p,i)=>'<div><input value="'+esc(p)+'" onchange="players['+i+']=this.value;save()"><button onclick="score('+i+',-1)">−</button><b>'+scores[i]+'</b><button class="primary" onclick="score('+i+',1)">＋</button></div>').join('')+'<button onclick="players.push(\'チーム\'+(players.length+1));scores.push(0);save();render()">＋ チーム追加</button><button onclick="if(confirm(\'得点をリセットしますか？\')){scores=scores.map(()=>0);save();render()}">リセット</button></div>'}el('view').innerHTML=v}
function game(name){let g=games.find(x=>x[0]===name);el('view').innerHTML='<button onclick="render()">← 一覧へ</button><div class="card"><h2>'+g[0]+'</h2><p>'+g[3]+'</p><p>目安 '+g[2]+'人〜</p><button class="primary" onclick="tab=\'お題\';render()">お題を出す</button><button onclick="tab=\'タイマー\';render()">タイマー</button></div>'}
function reset(n){clearInterval(timer);timer=null;seconds=n;render()}function toggle(){if(timer){clearInterval(timer);timer=null;render();return}timer=setInterval(()=>{seconds=Math.max(0,seconds-1);if(el('clock'))el('clock').textContent=fmt(seconds);if(!seconds){clearInterval(timer);timer=null;alert('時間です！');render()}},1000);render()}function score(i,n){scores[i]+=n;save();render()}render();
</script></html>
